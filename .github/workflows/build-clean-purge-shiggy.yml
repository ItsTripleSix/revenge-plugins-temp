name: Build clean Shiggy Purge Tools

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-clean-purge-shiggy.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build single-plugin Shiggy port
        shell: python
        run: |
          import hashlib
          import json
          import pathlib
          import re
          import shutil
          import urllib.request

          source_url = "https://raw.githubusercontent.com/ItsTripleSix/revenge-plugins/main/plugins/purge-tools/index.js"
          source = urllib.request.urlopen(source_url, timeout=30).read().decode("utf-8")

          source = source.replace(
              'const PLUGIN_VERSION = "1.1.1";',
              'const PLUGIN_VERSION = "1.1.2-shiggy";',
              1,
          )
          source = source.replace(
              'const shortcutKey = "ITS_TRIPLE_SIX_PURGE_TOOLS";',
              'const shortcutKey = "ITS_TRIPLE_SIX_PURGE_TOOLS_SHIGGY";',
              1,
          )

          old_section = '''const section = sections.find(item =>
          Array.isArray(item?.settings) && item.settings.includes("BUNNY")
        ) ?? sections.find(item => item?.label === "Revenge" || item?.title === "Revenge");'''
          new_section = '''const section = sections.find(item =>
          Array.isArray(item?.settings)
          && (item.settings.includes("SHIGGYCORD") || item.settings.includes("BUNNY_PLUGINS"))
        ) ?? sections.find(item => item?.label === "ShiggyCord" || item?.title === "ShiggyCord");'''
          if old_section not in source:
              raise RuntimeError("Could not find Revenge settings section selector")
          source = source.replace(old_section, new_section, 1)

          old_insert = '''const fontsIndex = section.settings.indexOf("BUNNY_FONTS");
        const pluginsIndex = section.settings.indexOf("BUNNY_PLUGINS");
        const insertAt = fontsIndex >= 0
          ? fontsIndex + 1
          : pluginsIndex >= 0
            ? pluginsIndex + 1
            : section.settings.length;'''
          new_insert = '''const pluginsIndex = section.settings.indexOf("BUNNY_PLUGINS");
        const shiggyIndex = section.settings.indexOf("SHIGGYCORD");
        const insertAt = pluginsIndex >= 0
          ? pluginsIndex + 1
          : shiggyIndex >= 0
            ? shiggyIndex + 1
            : section.settings.length;'''
          if old_insert not in source:
              raise RuntimeError("Could not find Revenge shortcut insertion block")
          source = source.replace(old_insert, new_insert, 1)

          out = pathlib.Path("plugins/purge-tools/index.js")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(source, encoding="utf-8")

          data = out.read_bytes()
          blob_hash = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()

          manifest_path = pathlib.Path("plugins/purge-tools/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["main"] = "index.js"
          manifest["hash"] = blob_hash
          manifest["description"] = "ShiggyCord port: bulk-delete matching messages and reactions with previews, filters, permission checks, resume, verification, progress, bulk acceleration, and adaptive pacing."
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          shutil.rmtree("plugins/purge-tools-shortcut-test", ignore_errors=True)

      - name: Commit generated port
        shell: bash
        run: |
          git config user.name "ItsTripleSix"
          git config user.email "onlytriplesix@protonmail.com"
          git add plugins/purge-tools plugins/purge-tools-shortcut-test || true
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "port Purge Tools cleanly to ShiggyCord"
          git push
