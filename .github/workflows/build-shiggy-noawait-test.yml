name: Build Shiggy no-await test

on:
  push:
    paths:
      - .github/workflows/build-shiggy-noawait-test.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test repo
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Clone ShiggyCord
        run: git clone --depth 1 https://github.com/kmmiio99o/ShiggyCord.git shiggy

      - name: Apply startup test patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("shiggy/src/entry.ts")
          s = p.read_text()
          old = '    await require(".").default();'
          new = '    require(".").default();'
          if old not in s:
              raise SystemExit("Expected Shiggy startup await was not found")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Install dependencies and build
        working-directory: shiggy
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Publish test bundle
        run: |
          mkdir -p shiggy-test
          cp shiggy/dist/shiggycord.js shiggy-test/shiggycord.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shiggy-test/shiggycord.js
          if git diff --cached --quiet; then
            echo "Bundle unchanged"
          else
            git commit -m "test: build Shiggy startup no-await bundle"
            git push
          fi
